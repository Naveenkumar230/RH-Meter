<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquarelle — Control Hub</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; overflow: hidden; }

    #hub-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
height: -webkit-fill-available;
    }

    /* ── Topbar ── */
    .hub-topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 28px;
      height: 68px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      box-shadow: var(--shadow);
    }
    .hub-topbar-left  { display: flex; align-items: center; gap: 12px; flex: 1; }
    .hub-topbar-logo  { height: 52px; width: auto; object-fit: contain; }
    .hub-topbar-title {
      font-size: 1.4rem; font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 3px;
    }
    .hub-topbar-sub {
      font-size: 0.78rem; color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .hub-topbar-right { display: flex; align-items: center; gap: 10px; }

    /* ── Launcher ── */
    .hub-launcher {
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;  /* smooth scroll on iOS */
  overscroll-behavior: contain;       /* prevents page bounce */
}
    .hub-launcher::-webkit-scrollbar { width: 4px; }
    .hub-launcher::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .hub-section-label {
      font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--text-muted); margin-bottom: 20px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Card Grid ── */
    .hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .hub-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      cursor: pointer;
      display: flex; flex-direction: column;
      overflow: hidden;
      transition: all 0.25s ease;
      animation: fadeUp 0.4s ease both;
      text-decoration: none;
    }
    .hub-card:nth-child(1){animation-delay:.04s}
    .hub-card:nth-child(2){animation-delay:.08s}
    .hub-card:nth-child(3){animation-delay:.12s}
    .hub-card:nth-child(4){animation-delay:.16s}
    .hub-card:nth-child(5){animation-delay:.20s}

    .hub-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--card-accent, linear-gradient(90deg,#3b82f6,#06b6d4));
    }
    .hub-card:hover {
      transform: translateY(-5px);
      border-color: var(--card-hover-border, rgba(59,130,246,0.3));
      box-shadow: 0 12px 36px rgba(59,130,246,0.13);
    }

    .hub-card-top {
      display: flex; align-items: center; gap: 14px;
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
    }
    .hub-card-icon {
      width: 46px; height: 46px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 21px; flex-shrink: 0;
      background: var(--card-icon-bg, rgba(59,130,246,0.08));
      border: 1px solid var(--card-icon-border, rgba(59,130,246,0.15));
    }
    .hub-card-name {
      font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 4px;
    }
    .hub-card-desc {
      font-size: 0.75rem; color: var(--text-muted); line-height: 1.5;
    }

    .hub-card-bottom {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 20px; background: var(--bg);
    }
    .hub-card-tag {
      font-size: 0.67rem; font-family: 'JetBrains Mono', monospace; font-weight: 600;
      padding: 3px 9px; border-radius: 6px;
      background: var(--card-tag-bg, rgba(59,130,246,0.07));
      color: var(--card-tag-color, var(--accent-blue));
      border: 1px solid var(--card-tag-border, rgba(59,130,246,0.15));
    }
    .hub-card-arrow {
      font-size: 0.9rem; color: var(--text-muted);
      transition: all 0.2s; transform: translateX(-4px); opacity: 0;
    }
    .hub-card:hover .hub-card-arrow { opacity: 1; transform: translateX(0); color: var(--accent-blue); }

    /* new-tab badge */
    .hub-card-newtab {
      position: absolute; top: 10px; right: 10px;
      font-size: 0.6rem; font-family: 'JetBrains Mono', monospace; font-weight: 700;
      padding: 2px 7px; border-radius: 5px;
      background: rgba(99,102,241,0.08);
      color: var(--text-muted);
      border: 1px solid var(--border);
      opacity: 0; transition: opacity 0.2s;
    }
    .hub-card:hover .hub-card-newtab { opacity: 1; }

    /* ── Footer ── */
    .hub-footer {
      padding: 12px 28px;
      font-size: 0.72rem; color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .hub-footer-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green);
      animation: pulse 2s ease-in-out infinite; flex-shrink: 0;
    }

    @keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:.35} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

  @media (max-width: 600px) {
  .hub-topbar        { padding: 0 14px; height: auto; min-height: 60px; }
  .hub-topbar-left   { flex: 1; min-width: 0; overflow: hidden; }
  .hub-topbar-logo   { height: 36px; flex-shrink: 0; }
  .hub-topbar-title  { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hub-topbar-sub    { font-size: 0.65rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hub-topbar-right  { display: none; }   /* hides the clock on mobile */
  .hub-launcher      { padding: 16px 12px; }
  .hub-grid          { grid-template-columns: 1fr; gap: 12px; }
  .hub-footer        { padding: 10px 14px; font-size: 0.65rem; }
  .hub-card-top      { padding: 14px 14px 12px; }
  .hub-card-bottom   { padding: 10px 14px; }
}
  </style>
</head>
<body>
<div id="hub-shell">

  <!-- TOPBAR -->
  <div class="hub-topbar">
    <div class="hub-topbar-left">
      <img src="logo.png" alt="Logo" class="hub-topbar-logo">
      <div>
        <div class="hub-topbar-title">IOT Nexus</div>
        <div class="hub-topbar-sub">Aquarelle India PVT.LTD</div>
      </div>
    </div>
    <div class="hub-topbar-right">
      <span style="font-size:0.75rem;color:var(--text-muted);font-family:'JetBrains Mono',monospace;" id="topClock"></span>
    </div>
  </div>

  <!-- LAUNCHER -->
  <div class="hub-launcher" id="hubLauncher">
    <div class="hub-section-label">All Applications</div>
    <div class="hub-grid" id="hubGrid"></div>
  </div>

  <!-- FOOTER -->
  <!-- <div class="hub-footer" id="hubFooter">
    <div class="hub-footer-dot"></div>
    <!-- <span>Aquarelle Control Hub &nbsp;·&nbsp; All times in IST</span> -->
    <span style="margin-left:auto" id="footerClock"></span>
  </div> -->

</div>
<script>
const APPS = [
  {
    name: 'RH-Meter',
    desc: 'Humidity & temperature — all factory zones',
    icon: '🌡️', tag: 'Environment', url: 'home.html',
    accent: 'linear-gradient(90deg,#3b82f6,#06b6d4)',
    hoverBorder: 'rgba(59,130,246,0.3)',
    iconBg: 'rgba(59,130,246,0.08)', iconBorder: 'rgba(59,130,246,0.15)',
    tagBg: 'rgba(59,130,246,0.07)', tagColor: 'var(--accent-blue)', tagBorder: 'rgba(59,130,246,0.15)'
  },
  {
    name: 'DG Monitoring',
    desc: 'Diesel generator status & alert management',
    icon: '⚡', tag: 'Power', url: 'https://dg-monitor.tail9e6e39.ts.net/',
    accent: 'linear-gradient(90deg,#f59e0b,#f97316)',
    hoverBorder: 'rgba(245,158,11,0.3)',
    iconBg: 'rgba(245,158,11,0.08)', iconBorder: 'rgba(245,158,11,0.15)',
    tagBg: 'rgba(245,158,11,0.07)', tagColor: 'var(--accent-orange)', tagBorder: 'rgba(245,158,11,0.15)'
  },
  {
    name: 'High Bay Lights',
    desc: 'Industrial lighting control & scheduling',
    icon: '💡', tag: 'Lighting', url: 'https://high-bay-light-1.onrender.com/',
    accent: 'linear-gradient(90deg,#10b981,#06b6d4)',
    hoverBorder: 'rgba(16,185,129,0.3)',
    iconBg: 'rgba(16,185,129,0.08)', iconBorder: 'rgba(16,185,129,0.15)',
    tagBg: 'rgba(16,185,129,0.07)', tagColor: 'var(--accent-green)', tagBorder: 'rgba(16,185,129,0.15)'
  },
  {
    name: 'Temperature Sensor',
    desc: 'Multi-zone sensor data & history',
    icon: '🔬', tag: 'Sensors', url: 'https://wts.evoluzn.org/public/Aquarelle/1d5b59b5643497ea',
    accent: 'linear-gradient(90deg,#ec4899,#a855f7)',
    hoverBorder: 'rgba(236,72,153,0.3)',
    iconBg: 'rgba(236,72,153,0.08)', iconBorder: 'rgba(236,72,153,0.15)',
    tagBg: 'rgba(236,72,153,0.07)', tagColor: '#ec4899', tagBorder: 'rgba(236,72,153,0.15)'
  },
  {
    name: 'Clean Aquarelle',
    desc: 'Cleaning checklist & compliance tracking',
    icon: '🧹', tag: 'Compliance', url: 'https://cleaning-checklist-aquarelle.onrender.com/',
    accent: 'linear-gradient(90deg,#a855f7,#3b82f6)',
    hoverBorder: 'rgba(168,85,247,0.3)',
    iconBg: 'rgba(168,85,247,0.08)', iconBorder: 'rgba(168,85,247,0.15)',
    tagBg: 'rgba(168,85,247,0.07)', tagColor: '#a855f7', tagBorder: 'rgba(168,85,247,0.15)'
  }
];

function buildGrid() {
  const grid = document.getElementById('hubGrid');
  APPS.forEach(app => {
    // Each card is a plain <a> tag — opens in new tab, no iframe at all
    const card = document.createElement('a');
    card.className = 'hub-card';
    card.href = app.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.style.cssText = `
      --card-accent:${app.accent};
      --card-hover-border:${app.hoverBorder};
      --card-icon-bg:${app.iconBg};
      --card-icon-border:${app.iconBorder};
      --card-tag-bg:${app.tagBg};
      --card-tag-color:${app.tagColor};
      --card-tag-border:${app.tagBorder};
    `;
    card.innerHTML = `
      <div class="hub-card-newtab">↗ new tab</div>
      <div class="hub-card-top">
        <div class="hub-card-icon">${app.icon}</div>
        <div>
          <div class="hub-card-name">${app.name}</div>
          <div class="hub-card-desc">${app.desc}</div>
        </div>
      </div>
      <div class="hub-card-bottom">
        <span class="hub-card-tag">${app.tag}</span>
        <span class="hub-card-arrow">→</span>
      </div>
    `;
    grid.appendChild(card);
  });
}

function updateClock() {
  const t = new Date().toLocaleTimeString('en-IN', {
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
  });
  document.getElementById('footerClock').textContent = t;
  document.getElementById('topClock').textContent = t;
}
updateClock();
setInterval(updateClock, 1000);
buildGrid();
</script>
</body>
</html>
